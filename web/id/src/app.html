<!doctype html>
<!-- The placeholders on the html tag below are replaced in hooks.server.ts
     with the reader's saved theme and language, so the page arrives already
     dark or light and named in the language it is written in. Do not repeat
     either token anywhere above this line: only the first occurrence of each
     is substituted. -->
<html lang="__LANG__" __THEME__>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="robots" content="noindex, nofollow" />
		<meta name="referrer" content="no-referrer" />
		<title>Account</title>
		<!-- The icon is named here rather than imported by the app, so it is
		     in the first byte of every page. A path that answers with
		     something other than a page has no head to name it in, and the
		     browser asks for /favicon.ico instead — which is a route of its
		     own, leading back to this same file. -->
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
