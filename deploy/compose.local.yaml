# A local trial of the production stack: the same compose.yaml, with the one
# thing that cannot work on one machine swapped out.
#
#   docker compose -f deploy/compose.yaml -f deploy/compose.local.yaml up -d --build
#
# Everything else is deliberately shared with the real stack — the same
# images, the same healthchecks, the same network and the same trusted
# addresses — so that what is tried here is what would be deployed.
#
# An explicit -f means compose does not pick up an override file on its own,
# so this one is always named.

services:
  caddy:
    volumes:
      # Caddyfile.local: the same routing, with Caddy's own CA instead of
      # Let's Encrypt and without the staff-network check. See the file.
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
